name: Minimum CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimum:
    name: Minimum CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test positive and failure paths
        run: |
          python3 -B - <<'PY'
          import unittest
          suite = unittest.TestLoader().discover('tests')
          if suite.countTestCases() < 51:
              raise SystemExit('Missing or reduced test suite')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.expectedFailures:
              raise SystemExit('Tests failed or were not fully executed')
          PY
      - name: Check repository evidence and build bundle
        run: |
          python3 -I -B src/license_check.py --root "$GITHUB_WORKSPACE" --policy .license-policy.json
          python3 -B tools/build_bundle.py --output "$RUNNER_TEMP/license-check-0.1.1.pyz"
          python3 -I -B "$RUNNER_TEMP/license-check-0.1.1.pyz" --root "$GITHUB_WORKSPACE" --policy .license-policy.json
          cd "$RUNNER_TEMP"
          sha256sum license-check-0.1.1.pyz > license-check-0.1.1.pyz.sha256
      - name: Retain tested distribution candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-check-0.1.1
          path: |
            ${{ runner.temp }}/license-check-0.1.1.pyz
            ${{ runner.temp }}/license-check-0.1.1.pyz.sha256
          if-no-files-found: error
          retention-days: 14
