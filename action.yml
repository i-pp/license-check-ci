# Added 2026-11-12: latest release verification candidate.

name: License policy check
description: Resolve the latest stable checker and verify its GitHub asset digest before execution
inputs:
  root:
    description: Repository root to inspect
    required: false
    default: ${{ github.workspace }}
  policy:
    description: Policy path relative to the inspected repository
    required: false
    default: .github/license-policy.json
  token:
    description: Optional read-only token for the fixed release metadata API only
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Resolve, verify and run latest checker
      shell: bash
      env:
        LICENSE_ACTION_PATH: ${{ github.action_path }}
        LICENSE_ROOT: ${{ inputs.root }}
        LICENSE_POLICY: ${{ inputs.policy }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        python3 -I -B "$LICENSE_ACTION_PATH/tools/latest_checker.py" \
          --root "$LICENSE_ROOT" --policy "$LICENSE_POLICY"
